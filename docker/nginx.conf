server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # /fr → /fr/index.html without a redirect to /fr/.
    absolute_redirect off;
    server_tokens off;
    charset utf-8;

    # Privacy: no access logs, so visitors' IP addresses are never stored (see /privacy).
    access_log off;
    error_log /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/markdown application/javascript application/json application/manifest+json application/wasm image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build output (main-XXXX.js, chunk-XXXX.js, worker-XXXX.js, styles-XXXX.css): cache forever.
    location ~* "-[A-Za-z0-9_]{8,}\.(js|css)$" {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ES module factories of ONNX Runtime / MediaPipe are not in nginx's default MIME map.
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Whisper models (served by this site, see scripts/download-models.mjs): large and stable,
    # cached a month by browsers (the app also keeps them in its own cache).
    location /models/ {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location = /models/manifest.json {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Large engines (WASM runtimes, face model) and fonts: versioned with the app, cached a week.
    location ~* ^/(ort|mediapipe|fonts|media|icons)/ {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /CHANGELOG.md {
        types { }
        default_type text/markdown;
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # The service worker and its manifest must always be revalidated to pick up new versions.
    location ~ ^/(ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js|theme-init\.js)$ {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location /i18n/ {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /sitemap.xml {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Public pages are prerendered (/fr/changelog → fr/changelog/index.html); the app (/app/…)
    # and unknown paths get the client-rendered shell. Never cached: always the latest version.
    location / {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html /index.csr.html;
    }
}
