<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LocalCutVideo — Edit videos in your browser, nothing is uploaded</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Free, open-source video editor that runs 100% in your browser: auto-cut silences, Whisper subtitles, text-based editing, 16:9 to 9:16 auto-framing and MP4 export. No upload, no account."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f6fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0b0f" />
    <link rel="canonical" href="https://localcutvideo.mbonnici.fr/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LocalCutVideo" />
    <meta property="og:title" content="LocalCutVideo — your videos never leave your computer" />
    <meta
      property="og:description"
      content="Auto-cut silences, Whisper subtitles, auto-framing and MP4 export, entirely in your browser."
    />
    <meta property="og:url" content="https://localcutvideo.mbonnici.fr/" />
    <meta property="og:image" content="https://localcutvideo.mbonnici.fr/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="LocalCutVideo, the video editor that runs in your browser" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- Applies the stored theme before first paint (external file to stay CSP-compliant). -->
    <script src="theme-init.js"></script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>LocalCutVideo needs JavaScript: all the video processing happens in your browser.</noscript>
  </body>
</html>
